{% extends "base.html" %}
{% block title %}가입 신청 완료{% endblock %}
{% block content %}
<div class="login-wrap"><div class="login" style="text-align:center">
  <h2>✅ 가입 신청 완료</h2>
  <p>관리자 승인 후 로그인할 수 있습니다.<br>이메일을 입력했다면 승인 결과를 메일로 알려 드립니다.</p>
  <p><a href="{{ url_for('auth.signup_status', login_id=login_id) }}">신청 상태 조회</a></p>
  <a class="btn pri" href="{{ url_for('auth.login') }}">로그인 화면으로</a>
</div></div>
{% endblock %}
